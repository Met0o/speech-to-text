services:
  whisper-cpu:
    build:
      context: .
      args:
        BASE_IMAGE: ubuntu:22.04
        USE_GPU: 0
    ports:
      - "8081:8080"
    volumes:
      - ./Release/build_cpu/models:/app/models
    environment:
      - MODEL_PATH=/app/models/${MODEL_FILENAME:-ggml-large-v3-turbo-q8_0.bin}


  whisper-gpu:
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:13.0.0-devel-ubuntu24.04
        USE_GPU: 1
        CUDA_ARCH: "86"
    runtime: nvidia
    ports:
      - "8080:8080"
    volumes:
      - ./Release/build_cpu/models:/app/models
    environment:
      - MODEL_PATH=/app/models/${MODEL_FILENAME:-ggml-large-v3-turbo-q8_0.bin}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web-ui:
    build:
      context: ./web_ui
    ports:
      - "5000:5000"
    environment:
      - WHISPER_GPU_URL=http://whisper-gpu:8080
      - WHISPER_CPU_URL=http://whisper-cpu:8080
      - DEFAULT_BACKEND=gpu
